<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="104" viewBox="0 0 1280 104">
  <style>
    @keyframes sweep { from { transform: translateX(-260px) } to { transform: translateX(1280px) } }
    .shine { animation: sweep 6s cubic-bezier(.45,0,.55,1) infinite }
    @media (prefers-reduced-motion: reduce) { .shine { animation: none; opacity: 0 } }
  </style>
  <defs>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#9333ea"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0"/><stop offset="0.25" stop-color="#60a5fa" stop-opacity="0.75"/>
      <stop offset="0.75" stop-color="#a855f7" stop-opacity="0.75"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#e9d5ff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect x="0" y="86" width="1280" height="4" rx="2"/></clipPath>
  </defs>
  <text x="640" y="56" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="url(#txt)">🧰 Toolbox</text>
  <rect x="0" y="87" width="1280" height="2" rx="1" fill="url(#line)"/>
  <g clip-path="url(#c)"><rect class="shine" x="0" y="86" width="260" height="4" fill="url(#light)"/></g>
  <circle cx="640" cy="88" r="4" fill="#818cf8"/>
</svg>
